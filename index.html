<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frost Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            text-align: center;
            padding: 20px;
        }

        img {
            max-width: 280px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
            margin-bottom: 15px;
        }

        p {
            font-size: 1.3rem;
            color: #a0d2ff;
        }
    </style>
</head>
<body>
    <!-- TU LOGO YA CON EL NOMBRE CORRECTO -->
    <img src="logo-frost.png" alt="Logo Frost Modz">

    <h1>👋 Bienvenido a Frost Page</h1>
    <p>Tu espacio listo para usar ✨</p>
</body>
</html>
