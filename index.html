<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Frost Page</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #02050a;
      color: white;
    }

    body {
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }


    /* =====================================================
       PARTÍCULAS
    ===================================================== */

    #particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 8px #00d9ff,
        0 0 15px #008cff;

      animation:
        particleFloat linear infinite;
    }

    @keyframes particleFloat {

      0% {
        transform:
          translateY(110vh)
          scale(.5);

        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      80% {
        opacity: .8;
      }

      100% {
        transform:
          translateY(-10vh)
          scale(1.2);

        opacity: 0;
      }

    }


    /* =====================================================
       PANTALLA INICIAL
    ===================================================== */

    #tapScreen {

      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      text-align: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          #123c55 0%,
          #07131c 30%,
          #02070b 65%,
          #000 100%
        );

      transition:
        opacity 1s ease,
        visibility 1s ease;

      cursor: pointer;

    }

    .enterLogo {

      width: 155px;

      margin-bottom: 30px;

      filter:
        drop-shadow(0 0 10px #00d9ff)
        drop-shadow(0 0 30px #0077ff);

      animation:
        logoFloat 3s ease-in-out infinite;

    }

    @keyframes logoFloat {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-12px)
          scale(1.05);
      }

    }

    .enterTitle {

      font-size: 35px;

      font-weight: 900;

      letter-spacing: 5px;

      text-shadow:
        0 0 10px white,
        0 0 25px #00d9ff,
        0 0 50px #0077ff;

    }

    .enterLine {

      width: 180px;

      height: 3px;

      margin-top: 22px;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #00d9ff,
          #5965ff,
          transparent
        );

      box-shadow:
        0 0 15px #00cfff;

    }

    .enterText {

      margin-top: 18px;

      color: #9bdfff;

      font-size: 14px;

      letter-spacing: 2px;

      animation:
        blink 1.5s infinite;

    }

    @keyframes blink {

      0%,
      100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }

    }


    /* =====================================================
       PÁGINA PRINCIPAL DETRÁS
    ===================================================== */

    #mainPage {

      position: fixed;
      inset: 0;

      z-index: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(0,170,255,.15),
          transparent 35%
        ),
        #02060a;

    }

    #mainLogo {

      width: 210px;

      opacity: 0;

      transform:
        scale(.5)
        rotate(-8deg);

      transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.17,.67,.3,1.3);

      filter:
        drop-shadow(0 0 12px #00d9ff)
        drop-shadow(0 0 35px #006cff);

    }

    #mainLogo.show {

      opacity: 1;

      transform:
        scale(1)
        rotate(0);

    }

    #frostTitle {

      margin-top: 25px;

      font-size: 30px;

      font-weight: 900;

      letter-spacing: 6px;

      opacity: 0;

      transform:
        translateY(20px);

      transition: 1s ease;

      text-shadow:
        0 0 10px white,
        0 0 25px #00d9ff,
        0 0 45px #006cff;

    }

    #frostTitle.show {

      opacity: 1;

      transform:
        translateY(0);

    }


    /* =====================================================
       BIENVENIDA
    ===================================================== */

    #welcome {

      position: fixed;
      inset: 0;

      z-index: 500;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.78);

      backdrop-filter:
        blur(15px);

      transition:
        opacity .5s ease;

    }

    .welcomeBox {

      position: relative;

      width: 100%;
      max-width: 420px;

      padding: 38px 25px;

      text-align: center;

      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(18,50,68,.95),
          rgba(3,8,13,.98)
        );

      border:
        1px solid rgba(0,210,255,.4);

      box-shadow:
        0 0 30px rgba(0,180,255,.2),
        0 0 80px rgba(0,100,255,.1);

      animation:
        welcomeIn .6s
        cubic-bezier(.17,.67,.3,1.3);

    }

    @keyframes welcomeIn {

      from {
        opacity: 0;
        transform:
          scale(.7)
          translateY(40px);
      }

      to {
        opacity: 1;
        transform:
          scale(1)
          translateY(0);
      }

    }

    .welcomeLogo {

      width: 115px;

      filter:
        drop-shadow(0 0 10px #00d9ff)
        drop-shadow(0 0 30px #006cff);

      animation:
        logoFloat 3s infinite;

    }

    .welcomeBox h2 {

      margin-top: 20px;

      font-size: 26px;

      text-shadow:
        0 0 10px white,
        0 0 25px #00d9ff;

    }

    .welcomeBox p {

      margin-top: 12px;

      color: #a7dcf5;

      line-height: 1.6;

    }

    .welcomeSmall {

      margin-top: 8px;

      color: #638da3;

      font-size: 12px;

    }

    #okButton {

      width: 100%;

      margin-top: 27px;

      padding: 15px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          90deg,
          #008cff,
          #00cfff,
          #5555ff
        );

      background-size: 200% 100%;

      color: white;

      font-size: 16px;

      font-weight: 900;

      letter-spacing: 2px;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(0,180,255,.3);

      transition: .3s;

    }

    #okButton:hover {

      background-position:
        100% 0;

      transform:
        translateY(-2px);

      box-shadow:
        0 0 35px rgba(0,200,255,.5);

    }

    #okButton:active {

      transform:
        scale(.96);

    }


    /* =====================================================
       FROST PAGE
    ===================================================== */

    #frostPage {

      position: fixed;
      inset: 0;

      z-index: 300;

      display: none;

      overflow-y: auto;

      background:
        radial-gradient(
          circle at 50% 5%,
          rgba(0,180,255,.16),
          transparent 35%
        ),
        #05050d;

      color: white;

    }

    .frostHeader {

      position: sticky;

      top: 0;

      z-index: 20;

      height: 72px;

      padding:
        0 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background:
        rgba(7,8,14,.9);

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid
        rgba(0,210,255,.2);

    }

    .headerLogo {

      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 20px;

      font-weight: 900;

      letter-spacing: 1px;

      text-shadow:
        0 0 12px #00d9ff;

    }

    .headerLogo img {

      width: 40px;
      height: 40px;

      object-fit: contain;

      filter:
        drop-shadow(0 0 8px #00d9ff);

    }

    .menuButton {

      width: 50px;
      height: 46px;

      border-radius: 13px;

      border:
        1px solid #00cfff;

      background:
        rgba(0,150,220,.1);

      color: white;

      font-size: 25px;

      cursor: pointer;

      box-shadow:
        0 0 15px
        rgba(0,190,255,.2);

    }

    .frostContent {

      max-width: 680px;

      margin: auto;

      padding:
        35px 18px 60px;

      text-align: center;

    }

    .heroIcon {

      width: 62px;
      height: 62px;

      margin:
        0 auto 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #00bfff,
          #5d3cff
        );

      font-size: 32px;

      box-shadow:
        0 0 30px
        rgba(0,190,255,.4);

    }

    .frostContent h1 {

      font-size: 30px;

      line-height: 1.2;

    }

    .frostContent h1 span {

      background:
        linear-gradient(
          90deg,
          #00d9ff,
          #6585ff
        );

      -webkit-background-clip: text;

      color: transparent;

    }

    .subtitle {

      margin-top: 14px;

      color: #929aae;

      font-size: 16px;

      line-height: 1.6;

    }

    .frostLine {

      width: 95px;
      height: 4px;

      margin:
        22px auto 35px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #00cfff,
          #695cff
        );

      box-shadow:
        0 0 15px #00bfff;

    }


    /* =====================================================
       TARJETA
    ===================================================== */

    .productCard {

      position: relative;

      overflow: hidden;

      text-align: left;

      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(18,25,39,.98),
          rgba(6,8,16,.98)
        );

      border:
        1px solid
        rgba(0,200,255,.18);

      box-shadow:
        0 20px 70px
        rgba(0,0,0,.45),
        0 0 35px
        rgba(0,170,255,.08);

      transition: .3s;

    }

    .productCard:hover {

      transform:
        translateY(-5px);

      border-color:
        rgba(0,210,255,.5);

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.5),
        0 0 45px
        rgba(0,180,255,.15);

    }

    .topBadge {

      position: absolute;

      top: 18px;
      left: 18px;

      padding:
        8px 15px;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #008cff,
          #6355ff
        );

      font-size: 12px;

      font-weight: 900;

      z-index: 5;

      box-shadow:
        0 0 15px
        rgba(0,180,255,.5);

    }

    .imageContainer {

      width: 100%;
      height: 260px;

      overflow: hidden;

      background: #080b12;

    }

    .imageContainer img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform .5s ease;

    }

    .productCard:hover
    .imageContainer img {

      transform:
        scale(1.04);

    }

    .productInfo {

      padding: 25px;

    }

    .category {

      color: #00cfff;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1.5px;

    }

    .productInfo h2 {

      margin-top: 10px;

      font-size: 25px;

    }

    .productInfo p {

      margin-top: 10px;

      color: #8993a8;

      line-height: 1.6;

    }

    .available {

      margin-top: 22px;

      color: #718097;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 2px;

    }

    .downloadButton {

      width: 100%;

      margin-top: 15px;

      padding: 16px;

      border: none;

      border-radius: 13px;

      color: white;

      font-size: 16px;

      font-weight: 900;

      letter-spacing: 1px;

      background:
        linear-gradient(
          90deg,
          #008cff,
          #00cfff,
          #5555ff
        );

      background-size:
        200% 100%;

      box-shadow:
        0 0 20px
        rgba(0,160,255,.3);

      cursor: pointer;

      transition: .3s;

    }

    .downloadButton:hover {

      background-position:
        100% 0;

      transform:
        translateY(-2px);

      box-shadow:
        0 0 35px
        rgba(0,190,255,.55);

    }

    .downloadButton:active {

      transform:
        scale(.97);

    }


    /* =====================================================
       MENÚ DE DESCARGAS
    ===================================================== */

    #downloadMenu {

      position: fixed;
      inset: 0;

      z-index: 700;

      display: none;

      overflow-y: auto;

      padding:
        35px 18px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(0,180,255,.15),
          transparent 35%
        ),
        #03050a;

    }

    .downloadBox {

      width: 100%;

      max-width: 500px;

      margin: auto;

      text-align: center;

    }

    .downloadLogo {

      width: 90px;

      filter:
        drop-shadow(0 0 12px #00d9ff)
        drop-shadow(0 0 30px #006cff);

    }

    .downloadBox h2 {

      margin-top: 18px;

      font-size: 28px;

      text-shadow:
        0 0 15px #00d9ff;

    }

    .downloadBox > p {

      margin-top: 8px;

      color: #7e899e;

    }

    .downloadList {

      margin-top: 30px;

      display: flex;

      flex-direction: column;

      gap: 13px;

    }

    .downloadItem {

      width: 100%;

      padding: 18px;

      display: flex;

      align-items: center;

      gap: 15px;

      border:
        1px solid
        rgba(0,200,255,.18);

      border-radius: 16px;

      background:
        linear-gradient(
          100deg,
          rgba(10,35,55,.8),
          rgba(8,10,20,.9)
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: .25s;

    }

    .downloadItem:hover {

      transform:
        translateX(5px);

      border-color:
        #00cfff;

      box-shadow:
        0 0 20px
        rgba(0,180,255,.15);

    }

    .itemIcon {

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(0,180,255,.12);

      font-size: 21px;

    }

    .downloadItem span:nth-child(2) {

      flex: 1;

      text-align: left;

    }

    .downloadItem b {

      color: #00cfff;

      font-size: 25px;

    }

    .backButton {

      margin-top: 30px;

      padding:
        13px 28px;

      border-radius: 12px;

      border:
        1px solid #00bfff;

      background:
        transparent;

      color: white;

      font-weight: bold;

      cursor: pointer;

      transition: .25s;

    }

    .backButton:hover {

      background:
        #008cff;

      box-shadow:
        0 0 20px
        rgba(0,190,255,.35);

    }


    /* =====================================================
       MODAL REDIRECCIÓN
    ===================================================== */

    #redirectModal {

      position: fixed;
      inset: 0;

      z-index: 99999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.84);

      backdrop-filter:
        blur(15px);

    }

    .redirectBox {

      width: 100%;

      max-width: 390px;

      padding:
        35px 25px;

      text-align: center;

      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          #0b1b27,
          #03070d
        );

      border:
        1px solid #00cfff;

      box-shadow:
        0 0 30px
        rgba(0,200,255,.25),
        inset 0 0 30px
        rgba(0,150,255,.05);

      animation:
        redirectIn .5s ease;

    }

    @keyframes redirectIn {

      from {

        opacity: 0;

        transform:
          scale(.75);

      }

      to {

        opacity: 1;

        transform:
          scale(1);

      }

    }

    .redirectBox img {

      width: 75px;

      filter:
        drop-shadow(0 0 10px #00d9ff)
        drop-shadow(0 0 25px #006cff);

    }

    .redirectIcon {

      margin-top: 15px;

      font-size: 30px;

      color: #00d9ff;

      text-shadow:
        0 0 15px #00d9ff;

    }

    .redirectBox h2 {

      margin-top: 10px;

      font-size: 25px;

    }

    .redirectBox p {

      margin-top: 8px;

      color: #8495a8;

    }

    #countdown {

      margin-top: 20px;

      font-size: 60px;

      font-weight: 900;

      color: #00d9ff;

      text-shadow:
        0 0 10px #00d9ff,
        0 0 30px #0077ff;

      animation:
        countdownPulse 1s infinite;

    }

    @keyframes countdownPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

    .loadingBar {

      width: 100%;

      height: 6px;

      margin-top: 15px;

      overflow: hidden;

      border-radius: 10px;

      background: #101c27;

    }

    #loadingProgress {

      width: 0%;

      height: 100%;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #008cff,
          #00eaff
        );

      box-shadow:
        0 0 15px #00cfff;

      transition:
        width 1s linear;

    }

    #cancelRedirect {

      margin-top: 25px;

      padding:
        11px 25px;

      border-radius: 10px;

      border:
        1px solid #315063;

      background:
        transparent;

      color: #8ea4b5;

      cursor: pointer;

    }

    #cancelRedirect:hover {

      color: white;

      border-color:
        #00cfff;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 500px) {

      .enterTitle {
        font-size: 28px;
      }

      .frostContent h1 {
        font-size: 26px;
      }

      .imageContainer {
        height: 220px;
      }

      .productInfo {
        padding: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       PARTÍCULAS
  ===================================================== -->

  <div id="particles"></div>


  <!-- =====================================================
       MÚSICA
  ===================================================== -->

  <audio
    id="music"
    loop
    preload="auto"
  >

    <source
      src="https://files.catbox.moe/a8nvz7.mp3"
      type="audio/mpeg"
    >

  </audio>


  <!-- =====================================================
       PANTALLA INICIAL
  ===================================================== -->

  <section id="tapScreen">

    <img
      src="logo-frost.png"
      class="enterLogo"
      alt="Frost"
    >

    <div class="enterTitle">
      FROST PAGE
    </div>

    <div class="enterLine"></div>

    <div class="enterText">
      ❄ TOCA EN LA PANTALLA PARA ENTRAR ❄
    </div>

  </section>


  <!-- =====================================================
       PÁGINA PRINCIPAL DETRÁS
  ===================================================== -->

  <main id="mainPage">

    <img
      src="logo-frost.png"
      id="mainLogo"
      alt="Frost Logo"
    >

    <div id="frostTitle">
      FROST PAGE
    </div>

  </main>


  <!-- =====================================================
       BIENVENIDA
  =======================
