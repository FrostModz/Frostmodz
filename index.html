<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frost Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .contenedor {
            animation: aparecer 1.5s ease forwards;
            opacity: 0;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
        }

        p {
            font-size: 1.3rem;
            color: #a0d2ff;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>👋 Bienvenido a Frost Page</h1>
        <p>Tu espacio listo para usar ✨</p>
    </div>
</body>
  </html>
