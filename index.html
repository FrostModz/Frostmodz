<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Frost Page</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000205;
      color: white;
      overflow-x: hidden;
    }

    body {
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    /* =====================================================
       FONDO ANIMADO CON LUCES
    ===================================================== */

    .bg-lights {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-lights::before,
    .bg-lights::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      animation: lightFloat 15s ease-in-out infinite;
    }

    .bg-lights::before {
      background: radial-gradient(circle, #00d9ff, transparent 70%);
      top: -200px;
      left: -150px;
    }

    .bg-lights::after {
      background: radial-gradient(circle, #5d3cff, transparent 70%);
      bottom: -200px;
      right: -150px;
      animation-delay: -7s;
    }

    @keyframes lightFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(100px, 50px) scale(1.1); }
      66% { transform: translate(-50px, 100px) scale(0.95); }
    }

    /* =====================================================
       GRID DE FONDO
    ===================================================== */

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      pointer-events: none;
    }

    /* =====================================================
       PARTÍCULAS MEJORADAS
    ===================================================== */

    #particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 10px #00d9ff,
        0 0 20px #008cff,
        0 0 30px #5d3cff;
      animation: particleFloat linear infinite;
    }

    .particle.glow {
      width: 5px;
      height: 5px;
      box-shadow:
        0 0 15px #00ffff,
        0 0 30px #00aaff,
        0 0 45px #7c3cff;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(110vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* =====================================================
       PANTALLA INICIAL
    ===================================================== */

    #tapScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(18, 60, 85, 0.8) 0%, rgba(7, 19, 28, 0.95) 30%, rgba(2, 7, 11, 0.98) 65%, #000 100%);
      transition: opacity 1.2s ease, visibility 1.2s ease, transform 1.2s ease;
      cursor: pointer;
    }

    #tapScreen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(0, 217, 255, 0.15), transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(93, 60, 255, 0.15), transparent 50%);
      animation: bgPulse 4s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .enterLogo {
      width: 170px;
      margin-bottom: 35px;
      position: relative;
      filter: 
        drop-shadow(0 0 15px #00d9ff)
        drop-shadow(0 0 35px #0077ff)
        drop-shadow(0 0 60px #5d3cff);
      animation: logoFloat 3s ease-in-out infinite;
    }

    .enterLogo::after {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.3), transparent 70%);
      animation: logoGlow 2s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.08); }
    }

    @keyframes logoGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .enterTitle {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(90deg, #ffffff, #00d9ff, #7c3cff, #00d9ff, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .enterLine {
      width: 220px;
      height: 3px;
      margin-top: 25px;
      border-radius: 20px;
      background: linear-gradient(90deg, transparent, #00d9ff, #5d3cff, #00d9ff, transparent);
      background-size: 200% 100%;
      box-shadow: 0 0 20px #00cfff, 0 0 40px #5d3cff;
      animation: lineShine 2s linear infinite;
    }

    @keyframes lineShine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .enterText {
      margin-top: 22px;
      color: #9bdfff;
      font-size: 15px;
      letter-spacing: 3px;
      animation: blink 1.5s infinite;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* =====================================================
       PÁGINA PRINCIPAL DETRÁS
    ===================================================== */

    #mainPage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: transparent;
    }

    #mainLogo {
      width: 230px;
      opacity: 0;
      transform: scale(0.3) rotate(-15deg);
      transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.17, 0.67, 0.3, 1.4);
      filter: 
        drop-shadow(0 0 20px #00d9ff)
        drop-shadow(0 0 45px #006cff)
        drop-shadow(0 0 70px #5d3cff);
    }

    #mainLogo.show {
      opacity: 1;
      transform: scale(1) rotate(0);
    }

    #frostTitle {
      margin-top: 30px;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 10px;
      opacity: 0;
      transform: translateY(30px);
      transition: 1.2s ease;
      background: linear-gradient(90deg, #ffffff, #00d9ff, #7c3cff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
      filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.3));
    }

    #frostTitle.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =====================================================
       BIENVENIDA
    ===================================================== */

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      transition: opacity 0.5s ease;
    }

    .welcomeBox {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(18, 50, 68, 0.98), rgba(3, 8, 13, 0.99));
      border: 1px solid rgba(0, 210, 255, 0.5);
      box-shadow: 
        0 0 40px rgba(0, 180, 255, 0.3),
        0 0 100px rgba(93, 60, 255, 0.2),
        inset 0 0 60px rgba(0, 150, 255, 0.05);
      animation: welcomeIn 0.7s cubic-bezier(0.17, 0.67, 0.3, 1.4);
      overflow: hidden;
    }

    .welcomeBox::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent,
        rgba(0, 217, 255, 0.1),
        transparent,
        rgba(93, 60, 255, 0.1),
        transparent
      );
      animation: boxShine 4s linear infinite;
    }

    @keyframes boxShine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes welcomeIn {
      from {
        opacity: 0;
        transform: scale(0.6) translateY(50px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .welcomeLogo {
      width: 125px;
      position: relative;
      filter: 
        drop-shadow(0 0 15px #00d9ff)
        drop-shadow(0 0 35px #006cff)
        drop-shadow(0 0 50px #5d3cff);
      animation: logoFloat 3s infinite;
    }

    .welcomeBox h2 {
      margin-top: 25px;
      font-size: 30px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff, #00d9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.4));
    }

    .welcomeBox p {
      margin-top: 15px;
      color: #a7dcf5;
      line-height: 1.7;
      font-size: 16px;
    }

    .welcomeSmall {
      margin-top: 10px;
      color: #638da3;
      font-size: 13px;
    }

    #okButton {
      width: 100%;
      margin-top: 32px;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(90deg, #008cff, #00cfff, #5555ff, #008cff);
      background-size: 300% 100%;
      color: white;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 
        0 0 25px rgba(0, 180, 255, 0.4),
        0 0 50px rgba(93, 60, 255, 0.2);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    #okButton::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    #okButton:hover {
      background-position: 100% 0;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 0 40px rgba(0, 200, 255, 0.6),
        0 0 80px rgba(93, 60, 255, 0.3);
    }

    #okButton:hover::before {
      left: 100%;
    }

    #okButton:active {
      transform: scale(0.97);
    }

    /* =====================================================
       FROST PAGE
    ===================================================== */

    #frostPage {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      overflow-y: auto;
      background: transparent;
      color: white;
    }

    .frostHeader {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 80px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
    }

    .headerLogo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff, #00d9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.4));
    }

    .headerLogo img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px #00d9ff) drop-shadow(0 0 25px #5d3cff);
    }

    .menuButton {
      width: 55px;
      height: 50px;
      border-radius: 15px;
      border: 1px solid #00cfff;
      background: linear-gradient(135deg, rgba(0, 150, 220, 0.2), rgba(93, 60, 255, 0.2));
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 190, 255, 0.3);
      transition: all 0.3s ease;
    }

    .menuButton:hover {
      transform: rotate(90deg);
      box-shadow: 0 0 30px rgba(0, 190, 255, 0.5);
    }

    .frostContent {
      max-width: 720px;
      margin: auto;
      padding: 45px 20px 70px;
      text-align: center;
    }

    .heroIcon {
      width: 75px;
      height: 75px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
      background: linear-gradient(135deg, #00bfff, #5d3cff, #00bfff);
      background-size: 200% 200%;
      font-size: 38px;
      box-shadow: 
        0 0 40px rgba(0, 190, 255, 0.5),
        0 0 70px rgba(93, 60, 255, 0.3);
      animation: gradientShift 3s ease infinite, iconFloat 3s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .frostContent h1 {
      font-size: 38px;
      line-height: 1.2;
      letter-spacing: 1px;
    }

    .frostContent h1 span {
      background: linear-gradient(90deg, #00d9ff, #7c3cff, #00d9ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.3));
    }

    .subtitle {
      margin-top: 18px;
      color: #929aae;
      font-size: 18px;
      line-height: 1.7;
    }

    .frostLine {
      width: 120px;
      height: 5px;
      margin: 28px auto 45px;
      border-radius: 15px;
      background: linear-gradient(90deg, #00cfff, #695cff, #00cfff);
      background-size: 200% 100%;
      box-shadow: 0 0 25px #00bfff, 0 0 50px #5d3cff;
      animation: lineShine 2s linear infinite;
    }

    /* =====================================================
       TARJETA DE PRODUCTO
    ===================================================== */

    .productCard {
      position: relative;
      overflow: hidden;
      text-align: left;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(18, 25, 39, 0.98), rgba(6, 8, 16, 0.99));
      border: 1px solid rgba(0, 200, 255, 0.25);
      box-shadow: 
        0 25px 80px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(0, 170, 255, 0.1);
      transition: all 0.5s cubic-bezier(0.17, 0.67, 0.3, 1.3);
    }

    .productCard::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #00d9ff, #5d3cff, #00d9ff, #5d3cff);
      background-size: 400% 400%;
      border-radius: 30px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.5s ease;
      animation: gradientShift 3s ease infinite;
    }

    .productCard:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: transparent;
      box-shadow: 
        0 35px 100px rgba(0, 0, 0, 0.7),
        0 0 70px rgba(0, 180, 255, 0.25);
    }

    .productCard:hover::before {
      opacity: 1;
    }

    .topBadge {
      position: absolute;
      top: 22px;
      left: 22px;
      padding: 10px 20px;
      border-radius: 25px;
      background: linear-gradient(90deg, #008cff, #6355ff);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      z-index: 5;
      box-shadow: 
        0 0 20px rgba(0, 180, 255, 0.6),
        0 0 40px rgba(93, 60, 255, 0.3);
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 180, 255, 0.6), 0 0 40px rgba(93, 60, 255, 0.3); }
      50% { box-shadow: 0 0 30px rgba(0, 180, 255, 0.8), 0 0 60px rgba(93, 60, 255, 0.5); }
    }

    .imageContainer {
      width: 100%;
      height: 300px;
      overflow: hidden;
      background: linear-gradient(135deg, #0a1525, #1a0a25);
      position: relative;
    }

    .imageContainer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        transparent 40%,
        rgba(0, 217, 255, 0.1) 50%,
        transparent 60%
      );
      background-size: 200% 200%;
      animation: imgShine 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes imgShine {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
    }

    .imageContainer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease, filter 0.5s ease;
      filter: saturate(1.1) contrast(1.05);
    }

    .productCard:hover .imageContainer img {
      transform: scale(1.1);
      filter: saturate(1.3) contrast(1.1);
    }

    .productInfo {
      padding: 32px;
    }

    .category {
      color: #00cfff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(0, 207, 255, 0.5);
    }

    .productInfo h2 {
      margin-top: 12px;
      font-size: 30px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #c0e8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .productInfo p {
      margin-top: 15px;
      color: #8993a8;
      line-height: 1.8;
      font-size: 16px;
    }

    .available {
      margin-top: 28px;
      color: #00ffaa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .available::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ffaa;
      box-shadow: 0 0 10px #00ffaa;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .downloadButton {
      width: 100%;
      margin-top: 20px;
      padding: 20px;
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #008cff, #00cfff, #5555ff, #008cff);
      background-size: 300% 100%;
      box-shadow: 
        0 0 30px rgba(0, 160, 255, 0.4),
        0 0 60px rgba(93, 60, 255, 0.2);
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .downloadButton::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    .downloadButton:hover {
      background-position: 100% 0;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 0 50px rgba(0, 190, 255, 0.6),
        0 0 100px rgba(93, 60, 255, 0.35);
    }

    .downloadButton:hover::before {
      left: 100%;
    }

    .downloadButton:active {
      transform: scale(0.97);
    }

    /* =====================================================
       MENÚ DE DESCARGAS
    ===================================================== */

    #downloadMenu {
      position: fixed;
      inset: 0;
      z-index: 700;
      display: none;
      overflow-y: auto;
      padding: 45px 20px;
      background: rgba(3, 5, 10, 0.97);
      backdrop-filter: blur(20px);
    }

    .downloadBox {
      width: 100%;
      max-width: 550px;
      margin: auto;
      text-align: center;
    }

    .downloadLogo {
      width: 100px;
      filter: 
        drop-shadow(0 0 18px #00d9ff)
        drop-shadow(0 0 40px #006cff)
        drop-shadow(0 0 60px #5d3cff);
      animation: logoFloat 3s infinite;
    }

    .downloadBox h2 {
      margin-top: 22px;
      font-size: 34px;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffffff, #00d9ff, #7c3cff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.3));
    }

    .downloadBox > p {
      margin-top: 12px;
      color: #7e899e;
      font-size: 16px;
    }

    .downloadList {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .downloadItem {
      width: 100%;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 20px;
      background: linear-gradient(100deg, rgba(10, 35, 55, 0.9), rgba(8, 10, 20, 0.95));
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.17, 0.67, 0.3, 1.3);
      position: relative;
      overflow: hidden;
    }

    .downloadItem::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: linear-gradient(180deg, #00d9ff, #5d3cff);
      box-shadow: 0 0 15px #00d9ff;
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .downloadItem:hover {
      transform: translateX(10px) scale(1.02);
      border-color: #00cfff;
      background: linear-gradient(100deg, rgba(15, 50, 75, 0.95), rgba(15, 10, 35, 0.98));
      box-shadow: 
        0 0 30px rgba(0, 180, 255, 0.25),
        0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .downloadItem:hover::before {
      transform: scaleY(1);
    }

    .itemIcon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(0, 180, 255, 0.2), rgba(93, 60, 255, 0.2));
      font-size: 26px;
      transition: all 0.4s ease;
      box-shadow: 0 0 15px rgba(0, 180, 255, 0.2);
    }

    .downloadItem:hover .itemIcon {
      transform: scale(1.15) rotate(-5deg);
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.5);
      background: linear-gradient(135deg, rgba(0, 180, 255, 0.35), rgba(93, 60, 255, 0.35));
    }

    .downloadItem span:nth-child(2) {
      flex: 1;
      text-align: left;
      letter-spacing: 0.5px;
    }

    .downloadItem b {
      color: #00cfff;
      font-size: 30px;
      transition: all 0.3s ease;
      text-shadow: 0 0 10px rgba(0, 207, 255, 0.5);
    }

    .downloadItem:hover b {
      transform: translateX(8px);
      color: #7c3cff;
    }

    .backButton {
      margin-top: 40px;
      padding: 16px 35px;
      border-radius: 15px;
      border: 1px solid #00bfff;
      background: transparent;
      color: white;
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .backButton:hover {
      background: linear-gradient(90deg, #008cff, #5555ff);
      border-color: transparent;
      box-shadow: 0 0 30px rgba(0, 190, 255, 0.4);
      transform: translateX(-5px);
    }

    /* =====================================================
       TOAST DE COPIADO
    ===================================================== */

    #copyToast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      z-index: 999999;
      padding: 18px 35px;
      border-radius: 18px;
      background: linear-gradient(90deg, #008cff, #00cfff, #5555ff);
      background-size: 200% 100%;
      color: white;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
      box-shadow: 
        0 0 35px rgba(0, 200, 255, 0.6),
        0 0 70px rgba(93, 60, 255, 0.3);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.17, 0.67, 0.3, 1.4);
      pointer-events: none;
      animation: toastGradient 2s linear infinite;
    }

    @keyframes toastGradient {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    #copyToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       MODAL REDIRECCIÓN
    ===================================================== */

    #redirectModal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(20px);
    }

    .redirectBox {
      width: 100%;
      max-width: 420px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: linear-gradient(145deg, #0b1b27, #03070d);
      border: 1px solid #00cfff;
      box-shadow: 
        0 0 50px rgba(0, 200, 255, 0.35),
        0 0 100px rgba(93, 60, 255, 0.2),
        inset 0 0 50px rgba(0, 150, 255, 0.08);
      animation: redirectIn 0.6s cubic-bezier(0.17, 0.67, 0.3, 1.4);
      position: relative;
      overflow: hidden;
    }

    .redirectBox::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(0, 217, 255, 0.1), transparent, rgba(93, 60, 255, 0.1), transparent);
      animation: rotate 4s linear infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    @keyframes redirectIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .redirectBox > * {
      position: relative;
      z-index: 1;
    }

    .redirectBox img {
      width: 85px;
      filter: 
        drop-shadow(0 0 15px #00d9ff)
        drop-shadow(0 0 35px #006cff)
        drop-shadow(0 0 50px #5d3cff);
    }

    .redirectIcon {
      margin-top: 18px;
      font-size: 35px;
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff;
      animation: iconSpin 2s linear infinite;
    }

    @keyframes iconSpin {
      100% { transform: rotate(360deg); }
    }

    .redirectBox h2 {
      margin-top: 12px;
      font-size: 28px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #00d9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .redirectBox p {
      margin-top: 10px;
      color: #8495a8;
      font-size: 15px;
    }

    #countdown {
      margin-top: 25px;
      font-size: 75px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff, #00d9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.6));
      animation: countdownPulse 1s ease-in-out infinite;
    }

    @keyframes countdownPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .loadingBar {
      width: 100%;
      height: 8px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 15px;
      background: #101c27;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    #loadingProgress {
      width: 0%;
      height: 100%;
      border-radius: 15px;
      background: linear-gradient(90deg, #008cff, #00eaff, #5d3cff);
      background-size: 200% 100%;
      box-shadow: 0 0 20px #00cfff;
      transition: width 1s linear;
      animation: shine 1s linear infinite;
    }

    #cancelRedirect {
      margin-top: 30px;
      padding: 14px 30px;
      border-radius: 12px;
      border: 1px solid #315063;
      background: transparent;
      color: #8ea4b5;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #cancelRedirect:hover {
      color: white;
      border-color: #ff4466;
      background: rgba(255, 68, 102, 0.1);
      box-shadow: 0 0 20px rgba(255, 68, 102, 0.3);
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 500px) {
      .enterTitle { font-size: 32px; letter-spacing: 5px; }
      .frostContent h1 { font-size: 30px; }
      .imageContainer { height: 240px; }
      .productInfo { padding: 25px; }
      .downloadBox h2 { font-size: 28px; }
      #countdown { font-size: 60px; }
    }

  </style>

</head>
